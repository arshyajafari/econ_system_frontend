name: Frontend Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify production API configuration
        run: |
          if grep -R -F "http://localhost:8000/api/v1" dist; then
            echo "Production bundle must not reference localhost."
            exit 1
          fi
          grep -R -F "https://api.econsystem.ir/api/v1" dist/assets >/dev/null
